name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run contrast
      - run: npm audit --omit=dev
      - run: npm run build
